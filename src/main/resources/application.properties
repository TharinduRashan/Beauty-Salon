# Server
server.port=8080

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Application
spring.application.name=Beauty Salon

# Data directory (relative to working directory)
app.data.dir=./data

# Salon settings
salon.timezone=Asia/Colombo
salon.opening-time=09:00
salon.closing-time=20:00
salon.booking-interval-minutes=15
salon.cancellation-hours-before=24
salon.advance-booking-days=90
salon.name=Glamour Beauty Salon
salon.address=123 Beauty Lane, Colombo 03, Sri Lanka
salon.phone=+94 11 234 5678
salon.email=info@glamourbeauty.lk

# Security
spring.security.user.name=disabled
spring.security.user.password=disabled

# Logging
logging.level.com.beautysalon=DEBUG
logging.level.org.springframework.security=INFO

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
